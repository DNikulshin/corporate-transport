name: Android Emulator Check

# Builds the Expo app into a release APK and launches it on a real Android
# emulator (KVM-accelerated on ubuntu-latest), then asserts the JS UI renders.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-e2e.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-e2e.yml'

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Build APK & smoke-test on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build release APK (x86_64 only)
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=x86_64 \
            -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -netdelay none -netspeed full
          script: bash mobile/scripts/android-smoke.sh

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-artifacts
          path: mobile/build/emulator-artifacts
          if-no-files-found: ignore
          retention-days: 7
